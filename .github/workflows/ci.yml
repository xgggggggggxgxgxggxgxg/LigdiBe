name: CI

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx eslint . --ext .ts,.tsx,.js
      # node:sqlite (tests des dépôts SQL) nécessite Node ≥ 22.5
      - run: npx jest --coverage --maxWorkers=2

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --legacy-peer-deps
      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ligdibe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    # Construit l'AAB signé pour Google Play quand un tag v* est poussé
    # (secrets à créer : LIGDIBE_UPLOAD_KEYSTORE_BASE64, LIGDIBE_UPLOAD_STORE_PASSWORD,
    #  LIGDIBE_UPLOAD_KEY_ALIAS, LIGDIBE_UPLOAD_KEY_PASSWORD).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --legacy-peer-deps
      - name: Restaurer la clé de publication
        run: echo "${{ secrets.LIGDIBE_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.keystore
      - name: Build AAB release
        working-directory: android
        env:
          LIGDIBE_UPLOAD_STORE_FILE: upload.keystore
          LIGDIBE_UPLOAD_STORE_PASSWORD: ${{ secrets.LIGDIBE_UPLOAD_STORE_PASSWORD }}
          LIGDIBE_UPLOAD_KEY_ALIAS: ${{ secrets.LIGDIBE_UPLOAD_KEY_ALIAS }}
          LIGDIBE_UPLOAD_KEY_PASSWORD: ${{ secrets.LIGDIBE_UPLOAD_KEY_PASSWORD }}
          LIGDIBE_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ligdibe-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
